name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Start server
        run: |
          nohup npx next start -p 3100 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/api/version; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready in 60s"
          tail -n 100 /tmp/next-start.log
          exit 1

      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          BASE_URL: http://127.0.0.1:3100
          SITE_URL: https://learnkana.pro

      - name: Server logs on failure
        if: failure()
        run: tail -n 200 /tmp/next-start.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true; fi
